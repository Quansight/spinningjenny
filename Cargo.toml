[package]
name = "spinningjenny"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "spinningjenny"
crate-type = ["cdylib"]

[dependencies]
crossbeam-channel = "0.5.16"
pyo3 = "0.29.0"
rayon = "1.12.0"

[profile.release]
lto = "thin"

[dev-dependencies]
proptest = {version = "1.11.0", default-features = false, features = ["std"]}
