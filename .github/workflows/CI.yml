name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-latest
            build: "*-manylinux*"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            build: "*-manylinux*"
          - name: musllinux-x86_64
            runner: ubuntu-latest
            build: "*-musllinux*"
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
            build: "*-musllinux*"
          - name: windows-x64
            runner: windows-latest
            build: "*-win*"
          - name: windows-aarch64
            runner: windows-11-arm
            build: "*-win*"
          - name: macos-aarch64
            runner: macos-latest
            build: "*-macosx*"
    steps:
      - uses: actions/checkout@v6
      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          output-dir: dist
          extras: uv
        env:
          CIBW_ARCHS: native
          CIBW_BUILD: ${{ matrix.platform.build }}
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group lint
          python -m pip install --only-deps '.[test]'
      - name: Clippy
        run: |
          rustup component add clippy
          cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked
      - name: Ruff
        run: python -m ruff check .
      - name: mypy
        run: python -m mypy

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [wheels, lint, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@v7
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'wheels-*/*'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
