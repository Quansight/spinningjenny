[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "spinningjenny"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[tool.maturin]
python-source = "pysrc"
module-name = "spinningjenny._spinningjenny"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-benchmark"
]

[dependency-groups]
lint = [
  "ruff",
  "mypy",
]

[tool.ruff]
src = ["pysrc"]

[tool.mypy]
python_version = "3.10"
files = ["pysrc", "tests"]

[[tool.mypy.overrides]]
# The Rust extension does not yet provide type stubs.
module = "spinningjenny._spinningjenny"
ignore_missing_imports = true

[tool.cibuildwheel]
# Keep building the supported PyPy wheels as well as CPython wheels.
enable = ["pypy"]
build-frontend = "build[uv]"
test-extras = ["test"]
test-command = "python -m pytest {project}/tests"

[tool.cibuildwheel.linux]
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
